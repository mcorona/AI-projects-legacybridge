[project]
name = "legacybridge"
version = "0.1.0"
description = "Reliable AI agents over legacy enterprise databases: secure, observable and measured."
readme = "README.md"
authors = [
    { name = "Manuel Corona", email = "manuel.corona@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.110",
    "fastapi>=0.143.0",
    "httpx2[http2]>=2.13.1",
    "mcp>=2.3.0",
    "openai>=3.26.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
legacybridge = "legacybridge.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long SQL and payloads are clearer unwrapped

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: needs the legacy Postgres (make db-up && make seed); skipped when it is unreachable",
    "llm: calls a real model; runs only with LB_RUN_LLM_TESTS=1 (slow, not deterministic)",
]
