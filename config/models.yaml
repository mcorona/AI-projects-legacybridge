# Runtime model profiles (ADR-003). Addresses, model names and keys come from environment
# variables (see .env.example); everything else about a profile lives here.
profiles:
  local-qwen:                  # LM Studio, Qwen3.6-35B-A3B
    kind: openai_compat
    base_url_env: LMSTUDIO_BASE_URL      # http://localhost:1234/v1
    model_env: LMSTUDIO_MODEL
    max_tokens: 6144           # Qwen thinks before it answers; a small budget returns nothing
    temperature: 0
    timeout_s: 900
    max_concurrency: 1         # one local GPU
    retries: 2
    backoff_base_s: 1
    price_in_per_mtok: 0       # runs on this machine
    price_out_per_mtok: 0
  omniroute-free:              # free-tier model combo behind OmniRoute (ADR-010)
    kind: openai_compat
    base_url_env: OMNIROUTE_BASE_URL     # http://localhost:20128/v1
    api_key_env: OMNIROUTE_API_KEY
    model_env: OMNIROUTE_MODEL           # a combo that supports tool calling
    max_tokens: 4096
    temperature: 0
    timeout_s: 240
    max_concurrency: 1         # free tiers rate-limit
    retries: 3
    backoff_base_s: 2
    synthetic_data_only: true  # refuses to start against a database not marked synthetic
    price_in_per_mtok: 0       # free tier
    price_out_per_mtok: 0
  bedrock-claude:              # Amazon Bedrock Converse, Claude Haiku 4.5 (ADR-014)
    kind: bedrock_converse
    model_env: BEDROCK_CHAT_MODEL        # an inference profile id, e.g. us.anthropic.claude-haiku-4-5-20251001-v1:0
    region_env: AWS_REGION
    default_region: us-east-1
    aws_profile_env: AWS_PROFILE         # empty in Lambda: the function's role is used
    max_tokens: 4096
    temperature: 0
    timeout_s: 120
    max_concurrency: 2
    retries: 4
    backoff_base_s: 1
    # USD per million tokens, copied from the AWS Price List (AmazonBedrockFoundationModels,
    # us-east-1, published 2026-10-08T23:56:37Z, read 2026-10-09): Claude Haiku 4.5, Regional
    # (the us. inference profile is geographic; Global would be 1.00 / 5.00). Never estimated.
    price_in_per_mtok: 1.10
    price_out_per_mtok: 5.50
  bedrock-claude-sonnet:       # ceiling comparison, ADR-014 extension: Claude Sonnet 4.6
    kind: bedrock_converse
    model_env: BEDROCK_SONNET_MODEL      # us.anthropic.claude-sonnet-4-6
    region_env: AWS_REGION
    default_region: us-east-1
    aws_profile_env: AWS_PROFILE
    max_tokens: 4096
    temperature: 0
    timeout_s: 180
    max_concurrency: 2
    retries: 4
    backoff_base_s: 1
    # AWS Price List (published 2026-10-08T23:56:37Z, read 2026-10-09), Regional: 3.30 / 16.50.
    price_in_per_mtok: 3.30
    price_out_per_mtok: 16.50
  bedrock-claude-opus:         # ceiling comparison, ADR-014 extension: Claude Opus 4.6
    kind: bedrock_converse
    model_env: BEDROCK_OPUS_MODEL        # us.anthropic.claude-opus-4-6-v1
    region_env: AWS_REGION
    default_region: us-east-1
    aws_profile_env: AWS_PROFILE
    max_tokens: 4096
    temperature: 0
    timeout_s: 240
    max_concurrency: 2
    retries: 4
    backoff_base_s: 1
    # AWS Price List (published 2026-10-08T23:56:37Z, read 2026-10-09), Regional: 5.50 / 27.50.
    price_in_per_mtok: 5.50
    price_out_per_mtok: 27.50

