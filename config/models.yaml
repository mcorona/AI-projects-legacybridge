# Precios y orden de la cascada.
# Precios verificados en el catálogo público de AWS (on-demand, us-east-1):
#   https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/us-east-1/index.json
#   publicationDate 2026-09-28T18:09:29Z, consultado 2026-09-28.
#   Claude Haiku 4.5: Regional $1.10 / $5.50 por 1M tokens (entrada / salida); Global $1.00 / $5.00.
#   El perfil `us.` es geográfico, así que aplica el precio Regional. (Fases 3-4 usaron $1/$5: subestimación de 10%.)
pricing:
  source: "AWS Price List API, AmazonBedrockFoundationModels, us-east-1"
  publication_date: "2026-09-28T18:09:29Z"
  retrieved: "2026-09-28"
cascade:
  # Cascada por LLAMADA (llm.router.chat con provider="cascade"): si un proveedor falla o responde
  # vacío, la misma llamada pasa al siguiente (ADR-002).
  order: [local, omniroute, bedrock]
  # Cascada por RESPUESTA (agent.cascade.CascadeAgent, `-p cascade` en CLI y harness; ADR-007): el
  # agente completo corre con el primer nivel y, si el resultado no pasa la política, la pregunta se
  # repite desde cero con el siguiente.
  agent_tiers: [local, bedrock]
  escalate_when:
    guard_failures: 2          # SQL rechazada (guard o BD) dos veces
    min_confidence: 0.6        # confianza calibrada de una respuesta
    provider_error: true       # todos los intentos del proveedor fallaron (p. ej. razonamiento desbocado)
    unfinished: true           # reintentos SQL agotados o max_steps
    answer_without_evidence: true
    cannot_answer: true        # el nivel barato no pudo responder

providers:
  local:
    kind: openai_compat
    base_url_env: LMSTUDIO_BASE_URL
    model_env: LMSTUDIO_CHAT_MODEL
    cost_per_mtok: {input: 0.0, output: 0.0}
    strip_think: true
  omniroute:
    kind: openai_compat
    base_url_env: OMNIROUTE_BASE_URL
    api_key_env: OMNIROUTE_API_KEY
    model_env: OMNIROUTE_CHAT_MODEL
    cost_per_mtok: {input: 0.0, output: 0.0}
    strip_think: true
    synthetic_data_only: true
  bedrock:
    kind: bedrock_converse
    model_env: BEDROCK_CHAT_MODEL
    cost_per_mtok: {input: 1.10, output: 5.50}   # Haiku 4.5, perfil geográfico us. = precio Regional
    strip_think: false
  # Techo de calidad de la Fase 5 (solo comparación; nunca en la cascada): Claude Opus 4.5. Opus 5.5 era
  # la primera opción pero su acuerdo de uso no está disponible para la cuenta (NOT_AVAILABLE, 2026-10-01).
  # Precio verificado en el mismo catálogo (consultado 2026-10-01): Regional $5.50 / $27.50 por 1M tokens.
  bedrock_ceiling:
    kind: bedrock_converse
    model_env: BEDROCK_CEILING_MODEL
    cost_per_mtok: {input: 5.50, output: 27.50}   # Opus 4.5, perfil geográfico us. = precio Regional
    strip_think: false

# Embeddings: proveedor FIJO por índice (sin cascada). Cambiar de modelo exige reindexar (make index).
embeddings:
  default: local
  providers:
    local:
      kind: openai_compat
      base_url_env: LMSTUDIO_BASE_URL
      model_env: LMSTUDIO_EMBED_MODEL
      dims: 1024
      cost_per_mtok: {input: 0.0}
    bedrock:
      kind: bedrock_titan
      model_env: BEDROCK_EMBED_MODEL
      dims: 1024
      cost_per_mtok: {input: 0.02}   # verificar precio vigente de Titan Text Embeddings v2
