# Precios y orden de la cascada.
# Precios verificados en el catálogo público de AWS (on-demand, us-east-1):
#   https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/us-east-1/index.json
#   publicationDate 2026-09-28T18:09:29Z, consultado 2026-09-28.
#   Claude Haiku 4.5: Regional $1.10 / $5.50 por 1M tokens (entrada / salida); Global $1.00 / $5.00.
#   El perfil `us.` es geográfico, así que aplica el precio Regional. (Fases 3-4 usaron $1/$5: subestimación de 10%.)
pricing:
  source: "AWS Price List API, AmazonBedrockFoundationModels, us-east-1"
  publication_date: "2026-09-28T18:09:29Z"
  retrieved: "2026-09-28"
cascade:
  order: [local, omniroute, bedrock]
  escalate_when:
    guard_failures: 2          # SQL rechazada dos veces por el guard
    min_confidence: 0.6        # autoevaluación del agente
    provider_error: true

providers:
  local:
    kind: openai_compat
    base_url_env: LMSTUDIO_BASE_URL
    model_env: LMSTUDIO_CHAT_MODEL
    cost_per_mtok: {input: 0.0, output: 0.0}
    strip_think: true
  omniroute:
    kind: openai_compat
    base_url_env: OMNIROUTE_BASE_URL
    api_key_env: OMNIROUTE_API_KEY
    model_env: OMNIROUTE_CHAT_MODEL
    cost_per_mtok: {input: 0.0, output: 0.0}
    strip_think: true
    synthetic_data_only: true
  bedrock:
    kind: bedrock_converse
    model_env: BEDROCK_CHAT_MODEL
    cost_per_mtok: {input: 1.10, output: 5.50}   # Haiku 4.5, perfil geográfico us. = precio Regional
    strip_think: false

# Embeddings: proveedor FIJO por índice (sin cascada). Cambiar de modelo exige reindexar (make index).
embeddings:
  default: local
  providers:
    local:
      kind: openai_compat
      base_url_env: LMSTUDIO_BASE_URL
      model_env: LMSTUDIO_EMBED_MODEL
      dims: 1024
      cost_per_mtok: {input: 0.0}
    bedrock:
      kind: bedrock_titan
      model_env: BEDROCK_EMBED_MODEL
      dims: 1024
      cost_per_mtok: {input: 0.02}   # verificar precio vigente de Titan Text Embeddings v2
