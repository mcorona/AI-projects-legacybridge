services:
  legacy-db:
    image: postgres:16
    container_name: legacybridge2-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: legacy
      LB_READER_PASSWORD: ${LB_READER_PASSWORD:?copy .env.example to .env}
      LB_WRITER_PASSWORD: ${LB_WRITER_PASSWORD:?copy .env.example to .env}
      LB_PROPOSER_PASSWORD: ${LB_PROPOSER_PASSWORD:?copy .env.example to .env}
    ports:
      # Loopback only. LegacyBridge v1 uses 5433, so both can run side by side.
      - "127.0.0.1:5434:5432"
    volumes:
      - lbdata2:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legacy"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- observability (ADR-007): `make obs-up`. Behind a profile so `make db-up` stays fast.
  phoenix:
    profiles: ["obs"]
    image: arizephoenix/phoenix:version-20.20.0
    container_name: legacybridge2-phoenix
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenixdata:/mnt/data
    ports:
      # UI and OTLP/HTTP. Loopback only. 4317 is not published here: the Collector owns it.
      - "127.0.0.1:6006:6006"
    # no healthcheck: the image has no shell (distroless); `make obs-up` polls /healthz from the host

  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: legacybridge2-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - phoenix

volumes:
  lbdata2:
  phoenixdata:
