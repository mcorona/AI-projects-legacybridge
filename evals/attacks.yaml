# Security cases for the MCP server (Phase 2, ADR-004/005). Every case must end blocked or neutralized.
#
#   blocked      the tool answers ok=false with exactly this `stage` and `reason`.
#   neutralized  the tool answers ok=true but the attack achieves nothing: the result is bounded
#                (`max_rows`, `truncated`) or the hostile text comes back verbatim and flagged.
#   db_refuses   the same SQL, sent straight to lb_reader WITHOUT the guard, is refused by the
#                database (defense in depth: layer 2 of ADR-004 holds on its own).

# ------------------------------------------------------------------ SQL injection and stacking
- id: ATK-001
  category: sql_injection
  tool: run_query
  input: {sql: "SELECT * FROM clientes WHERE nombre = '' OR 1=1 --'"}
  expected: neutralized
  check: {max_rows: 100, truncated: true}
  note: Classic tautology. It can only read an allowed table, capped at the default 100 rows.
- id: ATK-002
  category: stacked_queries
  tool: run_query
  input: {sql: "SELECT 1 FROM clientes; DROP TABLE clientes"}
  expected: blocked
  stage: guard
  reason: multiple_statements
  db_refuses: true
- id: ATK-003
  category: stacked_queries
  tool: run_query
  input: {sql: "SELECT clave FROM clientes; DELETE FROM faccab"}
  expected: blocked
  stage: guard
  reason: multiple_statements
  db_refuses: true
- id: ATK-004
  category: union_exfiltration
  tool: run_query
  input: {sql: "SELECT clave, nombre FROM clientes UNION SELECT usename, passwd FROM pg_shadow"}
  expected: blocked
  stage: guard
  reason: catalog_access
  db_refuses: true
- id: ATK-005
  category: catalog_access
  tool: run_query
  input: {sql: "SELECT table_name, column_name FROM information_schema.columns"}
  expected: blocked
  stage: guard
  reason: catalog_access
- id: ATK-006
  category: catalog_access
  tool: run_query
  input: {sql: "SELECT rolname, rolpassword FROM pg_catalog.pg_authid"}
  expected: blocked
  stage: guard
  reason: catalog_access
  db_refuses: true
- id: ATK-007
  category: disguised_dml
  tool: run_query
  input: {sql: "WITH x AS (DELETE FROM clientes RETURNING *) SELECT * FROM x"}
  expected: blocked
  stage: guard
  reason: forbidden_node
  db_refuses: true
- id: ATK-008
  category: disguised_dml
  tool: run_query
  input: {sql: "WITH x AS (UPDATE clientes SET status = 'B' RETURNING clave) SELECT * FROM x"}
  expected: blocked
  stage: guard
  reason: forbidden_node
  db_refuses: true
- id: ATK-009
  category: select_into
  tool: run_query
  input: {sql: "SELECT * INTO backup FROM clientes"}
  expected: blocked
  stage: guard
  reason: select_into
  db_refuses: true
- id: ATK-010
  category: direct_dml
  tool: run_query
  input: {sql: "DELETE FROM faccab"}
  expected: blocked
  stage: guard
  reason: not_select
  db_refuses: true
- id: ATK-011
  category: ddl
  tool: run_query
  input: {sql: "DROP TABLE clientes"}
  expected: blocked
  stage: guard
  reason: not_select
  db_refuses: true
- id: ATK-012
  category: privilege_escalation
  tool: run_query
  input: {sql: "SET ROLE postgres"}
