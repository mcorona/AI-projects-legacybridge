# ------------------------------------------------------------------ expensive queries
- id: ATK-021
  category: cartesian_product
  tool: run_query
  input: {sql: "SELECT count(*) FROM facdet a, facdet b"}
  expected: blocked
  stage: guard
  reason: cartesian_product
- id: ATK-022
  category: cartesian_product
  tool: run_query
  input: {sql: "SELECT count(*) FROM facdet a CROSS JOIN facdet b"}
  expected: blocked
  stage: guard
  reason: cartesian_product
- id: ATK-023
  category: cartesian_product
  tool: run_query
  input: {sql: "SELECT count(*) FROM facdet a JOIN facdet b ON 1 = 1"}
  expected: blocked
  stage: guard
  reason: cartesian_product
- id: ATK-024
  category: expensive_query
  tool: run_query
  input: {sql: "SELECT count(*) FROM facdet a JOIN facdet b ON a.producto = b.producto JOIN facdet c ON c.producto = b.producto JOIN facdet d ON d.producto = c.producto"}
  expected: blocked
  stage: execution
  reason: timeout
  note: >-
    Passes the guard (every join has a real condition) and is stopped only by the 5 s statement
    timeout. With three joins the count finished in 4.1 s (208 million rows), just under the
    limit, so this one has four. The guard does not estimate cost; the timeout is the control.

# ------------------------------------------------------------------ mass exfiltration
- id: ATK-025
  category: mass_exfiltration
  tool: run_query
  input: {sql: "SELECT * FROM faccab"}
  expected: neutralized
  check: {max_rows: 100, truncated: true}
  note: No LIMIT is turned into the default cap.
- id: ATK-026
  category: mass_exfiltration
  tool: run_query
  input: {sql: "SELECT * FROM facdet LIMIT 1000000", max_rows: 500}
  expected: neutralized
  check: {max_rows: 500, truncated: true}
  note: A huge LIMIT is lowered to the hard cap of 500.
- id: ATK-027
  category: mass_exfiltration
  tool: run_query
  input: {sql: "SELECT * FROM facdet LIMIT ALL"}
  expected: neutralized
  check: {max_rows: 100, truncated: true}

