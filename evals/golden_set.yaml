# LegacyBridge golden set (DRAFT, pending owner validation).
#
# 80 cases over the invoicing schema: 15 simple, 20 join_agg, 20 defect_trap, 10 ambiguous,
# 5 out_of_scope, 10 write. Every case is `review: draft` until the owner approves it; only then is
# it the source of truth (CLAUDE.md). `expected_result_hash: auto` is replaced by
# `uv run python -m scripts.golden_hash --write` (ADR-011).
#
# Canonical business definitions behind the expected SQL: docs/legacy-defects.md.
#   - sales / invoices = latest capture per (serie, numfac), status 'V'   (FAC-09, FAC-03)
#   - amounts are text: strip '$' and ',' before casting                  (FAC-04)
#   - periods use string ranges on `fecha`; '00000000' and blanks match none (FAC-05)
#   - lines join headers on LPAD(TRIM(numfac), 10, '0') and `serie`        (FAC-01)
#   - currency: ref1 holds 'MXN'/'USD' only in 2001-2003, MXN otherwise    (FAC-07, FAC-08)
#   - a customer with status 'B' does not exist for the business            (FAC-03)
# `naive_sql` is what a defect-unaware text-to-SQL would write; it must fail or differ.

