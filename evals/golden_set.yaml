- id: TRAP-001
  question: "¿Cuánto facturamos en pesos (MXN) a clientes de Jalisco en 2003?"
  category: defect_trap
  expected_behavior: answer
  review: draft
  defects: [FAC-03, FAC-04, FAC-05, FAC-08, FAC-09]
  expected_sql: |
    WITH f AS (
      SELECT DISTINCT ON (serie, numfac)
             serie, numfac, cliente, rfc, fecha, ref1, status,
             REPLACE(REPLACE(TRIM(total), '$', ''), ',', '')::numeric AS total
      FROM faccab
      ORDER BY serie, numfac, fcaptura DESC
    )
    SELECT SUM(f.total) AS total_mxn
    FROM f JOIN clientes c ON c.clave = f.cliente
    WHERE f.status = 'V' AND c.status <> 'B' AND c.estado = 'JAL'
      AND f.fecha BETWEEN '20030101' AND '20031231' AND f.ref1 = 'MXN'
  naive_sql: |
    SELECT SUM(CAST(f.total AS numeric))
    FROM faccab f JOIN clientes c ON c.clave = f.cliente
    WHERE c.estado = 'JAL' AND f.fecha BETWEEN '20030101' AND '20031231'
  expected_result_hash: sha256:aaff295275cc9c26f515577a912e8939e96a7ac11f327be4c033f1282a5cc38a

